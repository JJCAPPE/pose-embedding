name: Build contextual similarity study pack

on:
  push:
    branches:
      - docs/contextual-similarity-study-pack
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: docs/contextual-similarity-study-pack
          fetch-depth: 0

      - name: Reconstruct study-pack sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p contextual-similarity-study-pack
          cat .github/study-pack-payload/payload.part-*.b64 > /tmp/contextual-source-payload.b64
          base64 --decode /tmp/contextual-source-payload.b64 > /tmp/contextual-source-payload.tar.gz
          echo "f307a3db6def428f6e71eda168c52d2e968fac7a050880520fd1edef28838af2  /tmp/contextual-source-payload.tar.gz" | sha256sum --check -
          tar -xzf /tmp/contextual-source-payload.tar.gz -C contextual-similarity-study-pack

      - name: Compile LaTeX documents
        uses: xu-cheng/latex-action@v3
        with:
          working_directory: contextual-similarity-study-pack
          root_file: |
            contextual_similarity_textbook.tex
            contextual_similarity_meeting_brief.tex

      - name: Package and clean generated files
        shell: bash
        run: |
          set -euo pipefail
          find contextual-similarity-study-pack -maxdepth 1 -type f \
            ! -name 'README.md' \
            ! -name 'contextual_loss_reference.py' \
            ! -name 'contextual_similarity_textbook.tex' \
            ! -name 'contextual_similarity_meeting_brief.tex' \
            ! -name 'contextual_similarity_textbook.pdf' \
            ! -name 'contextual_similarity_meeting_brief.pdf' \
            -delete
          (
            cd contextual-similarity-study-pack
            zip -9 contextual_similarity_study_pack.zip \
              README.md \
              contextual_loss_reference.py \
              contextual_similarity_textbook.tex \
              contextual_similarity_meeting_brief.tex \
              contextual_similarity_textbook.pdf \
              contextual_similarity_meeting_brief.pdf
          )
          rm -rf .github/study-pack-payload
          rm -f .github/workflows/build-contextual-similarity-study-pack.yml

      - name: Commit generated study pack
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add contextual similarity study pack"
          git push origin HEAD:docs/contextual-similarity-study-pack
